<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js - Vista Isométrica con Cubo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>Grilla de Parcelas 10x10</strong><br>
        Usa la rueda del mouse para zoom | Arrastra para panear
    </div>

    <!-- Three.js desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Configuración de la escena
        let scene, camera, renderer, landPlot, controls;

        function init() {
            // Crear la escena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            // Configurar cámara ortográfica para vista isométrica
            const aspect = window.innerWidth / window.innerHeight;
            const frustumSize = 15; // Aumentado para ver toda la grilla
            camera = new THREE.OrthographicCamera(
                frustumSize * aspect / -2,  // left
                frustumSize * aspect / 2,   // right
                frustumSize / 2,            // top
                frustumSize / -2,           // bottom
                0.1,                        // near
                1000                        // far
            );

            // Posicionar la cámara para vista isométrica (ángulo 45°)
            camera.position.set(15, 15, 15);
            camera.lookAt(0, 0, 0);

            // Crear el renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Función para crear geometría redondeada (usando width, height, depth como X, Y, Z)
            function createRoundedBox(width, height, depth, radius, smoothness) {
                let shape = new THREE.Shape();
                let eps = 0.00001;
                let radius0 = radius - eps;
                shape.absarc(eps, eps, eps, -Math.PI / 2, -Math.PI, true);
                shape.absarc(eps, width - radius * 2, eps, Math.PI, Math.PI / 2, true);
                shape.absarc(depth - radius * 2, width - radius * 2, eps, Math.PI / 2, 0, true);
                shape.absarc(depth - radius * 2, eps, eps, 0, -Math.PI / 2, true);
                let geometry = new THREE.ExtrudeBufferGeometry(shape, {
                    depth: height - radius0 * 2,
                    bevelEnabled: true,
                    bevelSegments: smoothness * 2,
                    steps: 1,
                    bevelSize: radius,
                    bevelThickness: radius0,
                    curveSegments: smoothness
                });
                geometry.center();
                // Rotar para alinear correctamente con los ejes
                geometry.rotateX(Math.PI / 2);
                return geometry;
            }

            // Parámetros de cada parcela
            const plotWidth = 2;     // X
            const plotHeight = 0.6;  // Y - MÁS CORTO (corregido)
            const plotDepth = 2;     // Z
            const cornerRadius = 0.12;
            const smoothness = 6;
            const gridSize = 10;     // Grilla de 10x10
            const spacing = 2.3;     // Espaciado entre parcelas

            // Crear geometrías para las dos partes
            const topHeight = plotHeight * 0.3;
            const bottomHeight = plotHeight * 0.7;

            const topGeometry = createRoundedBox(plotWidth, topHeight, plotDepth, cornerRadius, smoothness);
            const bottomGeometry = createRoundedBox(plotWidth, bottomHeight, plotDepth, cornerRadius, smoothness);

            // Materiales
            const grassMaterial = new THREE.MeshPhongMaterial({
                color: 0x4CAF50,
                shininess: 30,
                specular: 0x222222
            });

            const soilMaterial = new THREE.MeshPhongMaterial({
                color: 0x8B4513,
                shininess: 20,
                specular: 0x111111
            });

            // Crear instancias para la parte superior (césped)
            const topInstancedMesh = new THREE.InstancedMesh(topGeometry, grassMaterial, gridSize * gridSize);
            topInstancedMesh.castShadow = true;
            topInstancedMesh.receiveShadow = true;

            // Crear instancias para la parte inferior (tierra)
            const bottomInstancedMesh = new THREE.InstancedMesh(bottomGeometry, soilMaterial, gridSize * gridSize);
            bottomInstancedMesh.castShadow = true;
            bottomInstancedMesh.receiveShadow = true;

            // Posicionar todas las instancias en una grilla
            const matrix = new THREE.Matrix4();
            const offsetX = -(gridSize - 1) * spacing / 2;
            const offsetZ = -(gridSize - 1) * spacing / 2;

            let instanceIndex = 0;
            for (let x = 0; x < gridSize; x++) {
                for (let z = 0; z < gridSize; z++) {
                    const posX = offsetX + x * spacing;
                    const posZ = offsetZ + z * spacing;

                    // Posicionar parte superior (césped)
                    matrix.setPosition(posX, topHeight * 0.5, posZ);
                    topInstancedMesh.setMatrixAt(instanceIndex, matrix);

                    // Posicionar parte inferior (tierra)
                    matrix.setPosition(posX, -bottomHeight * 0.5, posZ);
                    bottomInstancedMesh.setMatrixAt(instanceIndex, matrix);

                    instanceIndex++;
                }
            }

            topInstancedMesh.instanceMatrix.needsUpdate = true;
            bottomInstancedMesh.instanceMatrix.needsUpdate = true;

            scene.add(topInstancedMesh);
            scene.add(bottomInstancedMesh);

            // Añadir un plano como suelo (más grande para la grilla)
            const planeGeometry = new THREE.PlaneGeometry(50, 50);
            const planeMaterial = new THREE.MeshPhongMaterial({
                color: 0x2d2d2d,
                side: THREE.DoubleSide
            });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = Math.PI / 2;
            plane.position.y = -plotHeight;
            plane.receiveShadow = true;
            scene.add(plane);

            // Añadir iluminación
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // Añadir luz puntual para efecto extra
            const pointLight = new THREE.PointLight(0xff9900, 0.3);
            pointLight.position.set(-5, 5, -5);
            scene.add(pointLight);

            // Configurar controles (pan y zoom, sin rotación)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableRotate = false; // Sin rotación - mantiene vista isométrica fija
            controls.enableZoom = true; // Habilitar zoom
            controls.enablePan = true; // Habilitar pan (arrastrar)
            controls.zoomSpeed = 1.2;
            controls.panSpeed = 0.8;
            controls.screenSpacePanning = true;

            // Añadir ejes de referencia
            const axesHelper = new THREE.AxesHelper(3);
            scene.add(axesHelper);

            // Manejar redimensionamiento de ventana
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const frustumSize = 15;

            camera.left = frustumSize * aspect / -2;
            camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2;
            camera.bottom = frustumSize / -2;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Actualizar controles
            controls.update();

            // Renderizar la escena
            renderer.render(scene, camera);
        }

        // Iniciar la aplicación
        init();
        animate();
    </script>
</body>
</html>
